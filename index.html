<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <h1 class="title">Привет, солнышко! ☀️</h1>
        <p class="message">Ты делаешь мой мир ярче и теплее ✨</p>
        <div class="heart-button" onclick="handleClick(event)">
            Нажми на меня 💕
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="closePopup()"></div>
    
    <div class="popup" id="popup">
        <div class="popup-heart">💖</div>
        <div class="popup-text">
            Я так рада, что ты есть в моей жизни!<br>
            Ты самое дорогое, что у меня есть 
        </div>
        <button class="popup-close" onclick="closePopup()">
            Это так мило! 💕
        </button>
    </div>

    <script src="script.js"></script>
</body>
</html>
